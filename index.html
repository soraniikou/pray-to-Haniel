<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boundary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<script src="p5.min.js"></script>
<style>
  /* ---- layout constant: vertical position of release/keep text ---- */
  :root { --release-text-y: 44vh; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#050b14;
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  canvas { display:block; }

  #choiceLayer {
    position:fixed; inset:0;
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:9vh;
    z-index:15;
    pointer-events:none;
  }
  #choiceLayer.show { display:flex; }
  .choices {
    display:flex; gap:16vw;
    pointer-events:auto;
  }
  .choice-btn {
    background:none; border:none;
    font-family:'Shippori Mincho', serif;
    color:#dfe6ee;
    font-size:17px;
    letter-spacing:0.15em;
    padding:14px 6px;
    opacity:0;
    cursor:pointer;
    transition: opacity 1.6s ease, letter-spacing 0.4s ease, color 0.4s ease;
    border-bottom:1px solid rgba(223,230,238,0.25);
  }
  .choice-btn.visible { opacity:0.82; }
  .choice-btn:active { color:#f0d9a8; letter-spacing:0.22em; }

  #closing {
    position:fixed; inset:0;
    display:flex; align-items:flex-start; justify-content:center;
    padding-top: var(--release-text-y);
    background:#050b14;
    opacity:0;
    pointer-events:none;
    transition: opacity 3s ease;
    z-index:25;
    font-family:'Shippori Mincho', serif;
    color:#b7c2cc;
    font-size:15px;
    letter-spacing:0.18em;
    text-align:center;
  }
  #closing.show { opacity:1; pointer-events:auto; }

  #skip {
    position:fixed; bottom:18px; right:18px;
    font-size:10px; color:rgba(180,190,200,0.28);
    letter-spacing:0.08em;
    z-index:40; cursor:pointer;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }

  /* ===== END BUTTONS (back / stop) ===== */
  #endButtons {
    position:fixed; bottom:8vh; left:50%; transform:translateX(-50%);
    display:flex; gap:14vw;
    z-index:38;
    opacity:0; pointer-events:none;
    transition: opacity 1.8s ease;
  }
  #endButtons.show { opacity:1; pointer-events:auto; }
  .end-btn {
    background:none; border:none;
    font-family:'Shippori Mincho', serif;
    color:#c0ccd6;
    font-size:14px;
    letter-spacing:0.22em;
    padding:13px 8px;
    cursor:pointer;
    border-bottom:1px solid rgba(192,204,214,0.22);
    transition: color 0.35s ease, letter-spacing 0.35s ease, opacity 0.35s ease;
  }
  .end-btn:active { color:#f0d9a8; letter-spacing:0.30em; }

  /* ===== HANIEL ANGEL REVEAL ===== */
  #hanielReveal {
    position:fixed; inset:0;
    z-index:32;
    opacity:0;
    pointer-events:none;
    transition: opacity 4s ease;
  }
  #hanielReveal.show { opacity:1; }

  #hanielText {
    position:absolute;
    top: var(--release-text-y); left:50%; transform:translateX(-50%);
    font-family:'Shippori Mincho', serif;
    color:#e8d8a8;
    font-size:clamp(13px, 3.8vw, 16px);
    letter-spacing:0.2em;
    text-align:center;
    white-space:pre-line;
    line-height:2;
    z-index:2;
    text-shadow:0 0 28px rgba(255,210,100,0.45), 0 0 60px rgba(200,155,60,0.2);
    width:82%;
  }

  .h-petal {
    position:absolute;
    border-radius:80% 0 80% 0;
    pointer-events:none;
    opacity:0;
    animation:hPetalDrift linear infinite;
  }
  .h-leaf {
    position:absolute;
    border-radius:100% 0;
    pointer-events:none;
    opacity:0;
    animation:hLeafDrift linear infinite;
  }

  @keyframes hPetalDrift {
    0%   { transform:translate(0,0) rotate(0deg); opacity:0; }
    8%   { opacity:var(--op,0.65); }
    92%  { opacity:calc(var(--op,0.65)*0.3); }
    100% { transform:translate(var(--dx,160px),var(--dy,-220px)) rotate(var(--spin,540deg)); opacity:0; }
  }
  @keyframes hLeafDrift {
    0%   { transform:translate(0,0) rotate(0deg) scaleX(1); opacity:0; }
    10%  { opacity:var(--op,0.58); }
    50%  { transform:translate(calc(var(--dx,140px)*0.5),calc(var(--dy,-180px)*0.5)) rotate(calc(var(--spin,360deg)*0.5)) scaleX(-1); }
    90%  { opacity:calc(var(--op,0.58)*0.25); }
    100% { transform:translate(var(--dx,140px),var(--dy,-180px)) rotate(var(--spin,360deg)) scaleX(1); opacity:0; }
  }
</style>
</head>
<body>

<div id="choiceLayer">
  <div class="choices">
    <button class="choice-btn" id="btnRelease">release</button>
    <button class="choice-btn" id="btnKeep">keep</button>
  </div>
</div>

<div id="closing"></div>

<div id="endButtons">
  <button class="end-btn" id="btnBack">back</button>
  <button class="end-btn" id="btnStop">stop</button>
</div>

<div id="skip">reset</div>

<!-- ===== HANIEL ANGEL REVEAL ===== -->
<div id="hanielReveal">
  <div id="hanielText"></div>
  <!-- JS-generated animated petals injected here -->
</div>

<script>
/* ============================================================
   蠅・阜邱・窶・boundary
   headphones as the seam between his inner voice and the world.
   four movements: intro (boundary drawn) 竊・shadow time (angel-link
   sparkles) 竊・angel (the lights gather into a quiet presence) 竊・
   release (moon-mirror, one word, then silence).
   nothing is stored. nothing is scored.
============================================================ */

let scene = 'intro';       // intro -> transitioning -> shadow -> angel -> release -> end
let sceneT = 0;             // frames since scene entered
let sparkles = [];
const SPARK_TARGET = 6;

// Dragon constants — adjust these to tune appearance
const DRAGON_BODY_SEGMENTS = 30;    // number of spine points
const DRAGON_BODY_FRAC     = 0.44;  // body length as fraction of screen width
const DRAGON_AMPLITUDE     = 24;    // px — S-curve amplitude
const DRAGON_SPEED         = 1.1;   // px per frame — horizontal travel
const DRAGON_WAVE_SPEED    = 0.036; // undulation cycle rate
const DRAGON_WAVELENGTH    = 15;    // segments per one full wave (2 waves = S)
const DRAGON_MAX_ALPHA     = 24;    // max opacity (low = barely noticeable)
let ripples = [];
let cityLights = [];
let wingMotes = [];
let angelCenter = null;
const ANGEL_DURATION = 700;
let textAlpha = 0;
let introTextShown = false;
let shadowTextShown = false;
let releaseTextShown = false;
let horizonY;

let audioCtx = null;
let droneGain, padGain;
let started = false;
let tapSceneTimes = [];   // sceneT recorded on each tap (shadow scene)
let dragonShown   = false;
let dragonHeadX   = null;  // null = not active

// Shooting star constants
const STAR_SPEED       = 16;   // px per frame
const STAR_LENGTH      = 85;   // px — streak length
const STAR_MAX_ALPHA   = 175;  // peak opacity
const STAR_FADE_FRAMES = 30;   // frames to fade out after reaching moon

// Mandala constants
const MANDALA_MAX_ALPHA    = 32;   // peak opacity (very faint)
const MANDALA_MAX_RADIUS   = 110;  // px — outer radius
const MANDALA_OPEN_FRAMES  = 150;  // frames to expand to full size
const MANDALA_HOLD_FRAMES  = 60;   // frames at full size
const MANDALA_FADE_FRAMES  = 200;  // frames to dissolve
const MANDALA_LAYERS       = 4;    // concentric flower rings

let starShown    = false;
let shootingStar = null;   // null | { x0,y0,dirX,dirY,dist,t }
let mandalaShown = false;
let mandala      = null;   // null | { t }

function setupAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // low drone 窶・the sound that keeps playing when everything else stops
  const drone = audioCtx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 98;
  droneGain = audioCtx.createGain();
  droneGain.gain.value = 0;
  drone.connect(droneGain).connect(audioCtx.destination);
  drone.start();
  droneGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 3);

  // slow floating pad, an octave + fifth up, very soft
  const pad = audioCtx.createOscillator();
  pad.type = 'sine';
  pad.frequency.value = 147;
  padGain = audioCtx.createGain();
  padGain.gain.value = 0;
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.06;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 0.02;
  lfo.connect(lfoGain).connect(padGain.gain);
  lfo.start();
  pad.connect(padGain).connect(audioCtx.destination);
  pad.start();
  padGain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 5);
}

function chime(freq) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.value = 0.0001;
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t);
  g.gain.exponentialRampToValueAtTime(0.09, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
  osc.stop(t + 2.5);
}

function duckAudioForShadow() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  padGain.gain.cancelScheduledValues(t);
  padGain.gain.linearRampToValueAtTime(0.01, t + 2.5);
  droneGain.gain.cancelScheduledValues(t);
  droneGain.gain.linearRampToValueAtTime(0.065, t + 2.5);
}

function liftAudioForAngel() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  padGain.gain.cancelScheduledValues(t);
  padGain.gain.linearRampToValueAtTime(0.05, t + 3);
  droneGain.gain.cancelScheduledValues(t);
  droneGain.gain.linearRampToValueAtTime(0.045, t + 3);
}

function playAngelChimes() {
  if (!audioCtx) return;
  const notes = [523.25, 659.25, 783.99, 987.77, 1174.66];
  notes.forEach((f, i) => setTimeout(() => chime(f), i * 420));
}

function liftAudioForRelease() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  padGain.gain.cancelScheduledValues(t);
  padGain.gain.linearRampToValueAtTime(0.045, t + 4);
}

function fadeAudioOut() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  padGain.gain.cancelScheduledValues(t);
  droneGain.gain.cancelScheduledValues(t);
  padGain.gain.linearRampToValueAtTime(0.0001, t + 4);
  droneGain.gain.linearRampToValueAtTime(0.0001, t + 4);
}

const sketch = (p) => {

  p.setup = () => {
    const c = p.createCanvas(window.innerWidth, window.innerHeight);
    c.parent(document.body);
    horizonY = p.height * 0.58;
    for (let i = 0; i < 40; i++) {
      cityLights.push({
        x: p.random(p.width),
        y: horizonY + p.random(6, 40),
        r: p.random(0.6, 1.8),
        phase: p.random(p.TWO_PI)
      });
    }
    p.textFont('Shippori Mincho');
  };

  p.windowResized = () => {
    p.resizeCanvas(window.innerWidth, window.innerHeight);
    horizonY = p.height * 0.58;
  };

  function drawSky() {
    let topC, botC;
    if (scene === 'shadow') {
      topC = p.color(4, 7, 13);
      botC = p.color(6, 10, 18);
    } else if (scene === 'angel') {
      const bl = p.constrain(sceneT / ANGEL_DURATION, 0, 1);
      topC = p.lerpColor(p.color(4, 7, 13), p.color(8, 16, 30), bl);
      botC = p.lerpColor(p.color(6, 10, 18), p.color(15, 28, 46), bl);
    } else if (scene === 'release' || scene === 'end') {
      topC = p.color(8, 16, 30);
      botC = p.color(15, 28, 46);
    } else {
      topC = p.color(9, 18, 32);
      botC = p.color(16, 30, 48);
    }
    for (let y = 0; y < horizonY; y++) {
      const a = y / horizonY;
      p.stroke(p.lerpColor(topC, botC, a));
      p.line(0, y, p.width, y);
    }
  }

  function drawLake() {
    const lakeH = p.height - horizonY;
    let topC, botC;
    if (scene === 'shadow') {
      topC = p.color(18, 30, 78);
      botC = p.color(8, 16, 52);
    } else if (scene === 'angel') {
      const bl = p.constrain(sceneT / ANGEL_DURATION, 0, 1);
      topC = p.lerpColor(p.color(18, 30, 78), p.color(12, 22, 38), bl);
      botC = p.lerpColor(p.color(8, 16, 52), p.color(4, 8, 15), bl);
    } else {
      topC = p.color(12, 22, 38);
      botC = p.color(4, 8, 15);
    }
    for (let y = 0; y < lakeH; y++) {
      const a = y / lakeH;
      p.stroke(p.lerpColor(topC, botC, a));
      p.line(0, horizonY + y, p.width, horizonY + y);
    }
  }

  function moonVisibility() {
    if (scene === 'intro' || scene === 'transitioning') return p.constrain(sceneT / 90, 0, 0.35);
    if (scene === 'shadow') return 0.12;
    if (scene === 'angel') return p.constrain(sceneT / ANGEL_DURATION, 0, 0.4);
    if (scene === 'release') return p.constrain(sceneT / 140, 0, 1);
    if (scene === 'end') return 1;
    return 0;
  }

  function drawMoonAndReflection() {
    const vis = moonVisibility();
    if (vis <= 0.001) return;
    const mx = p.width * 0.5;
    const my = horizonY * 0.32;
    const r  = p.width * 0.055;
    const ctx = p.drawingContext;

    // ---- Glow: radial gradient, centre → transparent ----
    const glowR = r * 5.5;
    const grd = ctx.createRadialGradient(mx, my, r * 0.1, mx, my, glowR);
    grd.addColorStop(0,    `rgba(255,246,196,${(0.55 * vis).toFixed(3)})`);
    grd.addColorStop(0.18, `rgba(252,238,168,${(0.30 * vis).toFixed(3)})`);
    grd.addColorStop(0.48, `rgba(245,224,142,${(0.10 * vis).toFixed(3)})`);
    grd.addColorStop(1,    `rgba(240,216,128,0)`);
    ctx.save();
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(mx, my, glowR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ---- Moon body: soft edge via shadowBlur ----
    ctx.save();
    ctx.shadowColor = `rgba(255,248,200,${(0.72 * vis).toFixed(3)})`;
    ctx.shadowBlur  = r * 1.4;
    ctx.fillStyle   = `rgba(255,246,196,${(0.92 * vis).toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ---- Reflection: organic strips ----
    const lakeH = p.height - horizonY;
    const t = p.frameCount;
    p.noStroke();

    let reflY = 1, si = 0;
    while (reflY < lakeH * 0.84) {
      const yr = reflY / (lakeH * 0.84);   // 0 top → 1 bottom

      const gap      = 2 + yr * 8  + p.noise(si * 0.7,  t * 0.003) * 5;
      const thick    = Math.max(0.5, (2.4 - yr * 1.8) *
                        (0.7 + p.noise(si * 1.3, t * 0.005) * 0.6));
      const rawAlpha = p.map(yr, 0, 1, 85, 2) * vis *
                        (0.55 + p.noise(si * 2.1, t * 0.004) * 0.45);

      // Width: narrows & tears toward bottom
      const baseSpread = p.map(yr, 0, 1, r * 1.3, r * 0.25);
      const spread     = baseSpread * (0.65 + p.noise(si * 0.4, t * 0.002) * 0.7);

      // Multi-component wobble (3 sine frequencies)
      const wob =
        p.sin(t * 0.014 + reflY * 0.07        ) * 9 +
        p.sin(t * 0.008 + reflY * 0.032 + 1.4 ) * 5 +
        p.sin(t * 0.020 + reflY * 0.14  + 2.9 ) * 3;

      // Tearing: more likely at bottom
      const tear = p.noise(si * 0.85 + 4, t * 0.0015) < (yr * 0.45 + 0.12);

      if (!tear && rawAlpha > 0.8) {
        p.fill(240, 225, 160, rawAlpha);
        p.rect(mx - spread / 2 + wob, horizonY + reflY, spread, thick);
      }

      reflY += gap + thick;
      si++;
    }
  }

  function drawCityLights() {
    if (scene === 'shadow' || scene === 'angel' || scene === 'release' || scene === 'end') return;
    let fade = 1;
    if (scene === 'transitioning') fade = p.constrain(1 - sceneT / 70, 0, 1);
    p.noStroke();
    for (const l of cityLights) {
      const tw = 0.6 + 0.4 * p.sin(p.frameCount * 0.03 + l.phase);
      p.fill(180, 190, 170, 120 * fade * tw);
      p.circle(l.x, l.y, l.r * 3);
    }
  }

  function updateAngelConvergence() {
    if (scene !== 'angel') return;
    const t = p.constrain(sceneT / 150, 0, 1);
    const eased = t * t * (3 - 2 * t);
    for (const s of sparkles) {
      if (s.tx === undefined) continue;
      s.x = p.lerp(s.ox, s.tx, eased);
      s.y = p.lerp(s.oy, s.ty, eased);
    }
  }

  function enterAngelScene() {
    angelCenter = { x: p.width * 0.5, y: horizonY * 0.86 };
    const half = Math.floor(SPARK_TARGET / 2);
    sparkles.forEach((s, i) => {
      const side = i % 2 === 0 ? -1 : 1;
      const idx = Math.floor(i / 2);
      const t = half > 1 ? idx / (half - 1) : 0;
      const spread = 30 + t * 150;
      const rise = -10 - t * 90 - Math.sin(t * Math.PI) * 30;
      s.ox = s.x; s.oy = s.y;
      s.tx = angelCenter.x + side * spread;
      s.ty = angelCenter.y + rise;
    });

    wingMotes = [];
    for (const side of [-1, 1]) {
      for (let i = 0; i < 15; i++) {
        const t = i / 14;
        const spread = 25 + t * 165;
        const rise = -15 - 120 * Math.sin(t * Math.PI / 2) + t * t * 35;
        wingMotes.push({
          bx: side * spread + p.random(-6, 6),
          by: rise + p.random(-6, 6),
          phase: p.random(p.TWO_PI)
        });
      }
    }
  }

  function drawWingMotes() {
    if (scene !== 'angel' || !angelCenter) return;
    const fadeIn = p.constrain(sceneT / 140, 0, 1);
    const fadeOut = p.constrain((ANGEL_DURATION - sceneT) / 120, 0, 1);
    const alphaMul = Math.min(fadeIn, fadeOut);
    if (alphaMul <= 0) return;
    p.noStroke();
    for (const m of wingMotes) {
      const pulse = (0.6 + 0.4 * p.sin(p.frameCount * 0.04 + m.phase)) * alphaMul;
      const x = angelCenter.x + m.bx;
      const y = angelCenter.y + m.by;
      for (let i = 3; i > 0; i--) {
        p.fill(245, 228, 190, 8 * i * pulse);
        p.circle(x, y, (4 + i * 5) * pulse);
      }
      p.fill(250, 240, 210, 200 * pulse);
      p.circle(x, y, 2.4);
    }
  }

  function drawSparklesAndRipples() {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.age++;
      const alpha = p.map(r.age, 0, 60, 90, 0);
      if (alpha <= 0) { ripples.splice(i, 1); continue; }
      p.noFill();
      p.stroke(210, 220, 235, alpha);
      p.strokeWeight(1);
      p.circle(r.x, r.y, r.age * 1.6);
    }

    if (scene === 'shadow' || scene === 'angel') {
      let fadeMul = 1;
      if (scene === 'angel') fadeMul = p.constrain((ANGEL_DURATION - sceneT) / 120, 0, 1);
      for (const s of sparkles) {
        const pulse = (0.7 + 0.3 * p.sin(p.frameCount * 0.05 + s.phase)) * fadeMul;
        p.noStroke();
        for (let i = 4; i > 0; i--) {
          p.fill(240, 220, 168, 10 * i * pulse);
          p.circle(s.x, s.y, (6 + i * 6) * pulse);
        }
        p.fill(250, 236, 200, 230 * pulse);
        p.circle(s.x, s.y, 4);
      }
    }
  }

  function drawWaves() {
    if (scene !== 'shadow' && scene !== 'angel') return;
    let alphaScale = 1;
    if (scene === 'angel') alphaScale = p.constrain((ANGEL_DURATION - sceneT) / 180, 0, 1);

    const lakeH    = p.height - horizonY;
    const t        = p.frameCount;
    const waveCount = 22;
    p.noFill();

    for (let wi = 0; wi < waveCount; wi++) {
      const yRatio = (wi / (waveCount - 1)) * 0.74;
      const wy     = horizonY + yRatio * lakeH;

      const depthFade  = p.map(yRatio, 0, 0.74, 1, 0.12);
      const noiseAlpha = 0.45 + p.noise(wi * 0.6, t * 0.0035) * 0.55;
      const a     = 44 * depthFade * noiseAlpha * alphaScale;
      const thick = Math.max(0.3,
        (1.4 - yRatio * 1.1) * (0.65 + p.noise(wi * 1.2, t * 0.003) * 0.7));

      p.strokeWeight(thick);
      p.stroke(100, 130, 210, a);

      const segW = 7;
      let prevX = 0, prevY = wy, broken = false;

      for (let x = segW; x <= p.width + segW; x += segW) {
        const fx  = x / p.width;
        const amp = 2.5 + wi * 0.18;

        // 3 sine frequencies + Perlin noise
        const disp =
          p.sin(t * 0.006 + fx * 6.0  + wi * 0.88) * amp +
          p.sin(t * 0.010 + fx * 11.5 + wi * 2.05) * (amp * 0.5) +
          p.sin(t * 0.004 + fx * 4.0  + wi * 1.55) * (amp * 0.7) +
          (p.noise(fx * 4.5, t * 0.005 + wi * 0.48) - 0.5) * 4.5;

        const curY = wy + disp;

        // Random breaks — more frequent at depth
        if (p.noise(fx * 7 + wi * 0.35, t * 0.0018) > 0.74 - yRatio * 0.12) {
          broken = true; prevX = x; prevY = curY; continue;
        }
        if (!broken) p.line(prevX, prevY, x, curY);
        broken = false; prevX = x; prevY = curY;
      }
    }
  }

  function drawShootingStar() {
    if (!shootingStar) return;
    shootingStar.t++;
    const { x0, y0, dirX, dirY, dist } = shootingStar;
    const travelFrames = Math.ceil(dist / STAR_SPEED) + 10;
    const totalFrames  = travelFrames + STAR_FADE_FRAMES;
    if (shootingStar.t > totalFrames) { shootingStar = null; return; }

    const prog  = Math.min(shootingStar.t * STAR_SPEED / dist, 1);
    const headX = x0 + dirX * prog * dist;
    const headY = y0 + dirY * prog * dist;
    const tailX = headX - dirX * STAR_LENGTH;
    const tailY = headY - dirY * STAR_LENGTH;

    let al = shootingStar.t < 8
      ? shootingStar.t / 8
      : shootingStar.t > travelFrames
        ? 1 - (shootingStar.t - travelFrames) / STAR_FADE_FRAMES
        : 1;
    al = p.constrain(al, 0, 1);

    p.noFill();
    const segs = 14;
    for (let s = 0; s < segs; s++) {
      const t1 = s / segs, t2 = (s + 1) / segs;
      const segAl = al * t1 * t1 * STAR_MAX_ALPHA;
      p.stroke(222, 232, 250, segAl);
      p.strokeWeight(0.8 + t1 * 0.8);
      p.line(
        tailX + (headX - tailX) * t1, tailY + (headY - tailY) * t1,
        tailX + (headX - tailX) * t2, tailY + (headY - tailY) * t2
      );
    }
    // Head glint
    p.noStroke();
    p.fill(235, 242, 255, al * STAR_MAX_ALPHA * 0.9);
    p.circle(headX, headY, 3.5);
  }

  function drawMandala() {
    if (!mandala) return;
    mandala.t++;
    const T = MANDALA_OPEN_FRAMES + MANDALA_HOLD_FRAMES + MANDALA_FADE_FRAMES;
    if (mandala.t > T) { mandala = null; return; }

    const mx = p.width  * 0.5;
    const my = horizonY * 0.32;

    let sc, al;
    if (mandala.t <= MANDALA_OPEN_FRAMES) {
      const t = mandala.t / MANDALA_OPEN_FRAMES;
      sc = t * t * (3 - 2 * t);   // smooth-step
      al = sc;
    } else if (mandala.t <= MANDALA_OPEN_FRAMES + MANDALA_HOLD_FRAMES) {
      sc = 1; al = 1;
    } else {
      const t = (mandala.t - MANDALA_OPEN_FRAMES - MANDALA_HOLD_FRAMES) / MANDALA_FADE_FRAMES;
      sc = 1; al = 1 - t * t;
    }
    al = p.constrain(al, 0, 1) * MANDALA_MAX_ALPHA;
    const R = MANDALA_MAX_RADIUS * sc;

    p.noFill();

    // Concentric flower rings
    for (let L = 0; L < MANDALA_LAYERS; L++) {
      const r      = R * (L + 1) / MANDALA_LAYERS;
      const ringAl = al * (1 - L * 0.14);
      const rot    = L * Math.PI / 18;   // slight per-layer rotation

      p.stroke(215, 225, 245, ringAl);
      p.strokeWeight(0.65);

      for (let k = 0; k < 6; k++) {
        const ang  = k * Math.PI / 3 + rot;
        const a1   = ang - Math.PI / 6;
        const a2   = ang + Math.PI / 6;
        const bR   = r * 0.72;
        const tipX = mx + Math.cos(ang) * r;
        const tipY = my + Math.sin(ang) * r;
        const cpX  = mx + Math.cos(ang) * r * 1.20;
        const cpY  = my + Math.sin(ang) * r * 1.20;

        // Left arc of petal
        p.beginShape();
        p.vertex(mx + Math.cos(a1) * bR, my + Math.sin(a1) * bR);
        p.quadraticVertex(cpX, cpY, tipX, tipY);
        p.endShape();
        // Right arc of petal
        p.beginShape();
        p.vertex(mx + Math.cos(a2) * bR, my + Math.sin(a2) * bR);
        p.quadraticVertex(cpX, cpY, tipX, tipY);
        p.endShape();
      }

      // Faint concentric ring
      p.stroke(215, 225, 245, ringAl * 0.38);
      p.strokeWeight(0.38);
      p.circle(mx, my, r * 2);
    }

    // 12 radial spokes
    p.stroke(215, 225, 245, al * 0.30);
    p.strokeWeight(0.45);
    for (let i = 0; i < 12; i++) {
      const ang = i * Math.PI / 6;
      p.line(mx, my,
        mx + Math.cos(ang) * R,
        my + Math.sin(ang) * R);
    }
    // Centre dot
    p.noStroke();
    p.fill(215, 225, 245, al * 0.55);
    p.circle(mx, my, 3 * sc);
  }

  function drawProgressDots() {
    if (scene !== 'shadow') return;
    const dotY    = horizonY + (p.height - horizonY) * 0.72;
    const spacing = p.width  * 0.08;
    const totalW  = spacing  * (SPARK_TARGET - 1);
    const startX  = p.width  / 2 - totalW / 2;

    p.noStroke();
    for (let i = 0; i < SPARK_TARGET; i++) {
      const x   = startX + i * spacing;
      const lit = i < sparkles.length;
      const pulse = lit ? (0.7 + 0.3 * p.sin(p.frameCount * 0.05 + i * 0.8)) : 1;

      if (lit) {
        // soft glow around lit dot
        for (let g = 3; g > 0; g--) {
          p.fill(240, 220, 160, 12 * g * pulse);
          p.circle(x, dotY, (4 + g * 6) * 2);
        }
        p.fill(250, 236, 200, 200 * pulse);
        p.circle(x, dotY, 8);
      } else {
        p.fill(160, 185, 220, 22);   // almost invisible unlit dot
        p.circle(x, dotY, 5);
      }
    }
  }

  function drawDragon() {
    if (dragonHeadX === null) return;

    const lakeH  = p.height - horizonY;
    const baseY  = horizonY + lakeH * 0.30;   // inside the moon reflection band
    const bodyPx = p.width  * DRAGON_BODY_FRAC;
    const segLen = bodyPx   / DRAGON_BODY_SEGMENTS;
    const totalTravel = p.width + bodyPx;

    // Advance head
    dragonHeadX += DRAGON_SPEED;

    // Progress 0→1 over the full crossing
    const progress = (dragonHeadX + bodyPx) / totalTravel;

    // Fade in at start, fade out at end
    let alphaScale;
    if      (progress < 0.12) alphaScale = progress / 0.12;
    else if (progress > 0.82) alphaScale = (1 - progress) / 0.18;
    else                       alphaScale = 1;
    alphaScale = p.constrain(alphaScale, 0, 1);

    // Cleanup when fully off-screen
    if (progress >= 1) { dragonHeadX = null; return; }

    const animPhase = p.frameCount * DRAGON_WAVE_SPEED;

    p.noFill();
    for (let i = 0; i < DRAGON_BODY_SEGMENTS - 1; i++) {
      const x1 = dragonHeadX - i       * segLen;
      const x2 = dragonHeadX - (i + 1) * segLen;

      // Animated S-curve: 2 full waves along the body
      const y1 = baseY + DRAGON_AMPLITUDE * Math.sin(Math.PI * 2 * i       / DRAGON_WAVELENGTH - animPhase);
      const y2 = baseY + DRAGON_AMPLITUDE * Math.sin(Math.PI * 2 * (i + 1) / DRAGON_WAVELENGTH - animPhase);

      // Taper: thicker near head, thin at tail
      const thick = p.map(i, 0, DRAGON_BODY_SEGMENTS - 1, 1.8, 0.25);
      // Brightness: brightest near head
      const bright = p.map(i, 0, DRAGON_BODY_SEGMENTS - 1, 1.0, 0.35);

      p.strokeWeight(thick);
      p.stroke(218, 230, 248, DRAGON_MAX_ALPHA * alphaScale * bright);
      p.line(x1, y1, x2, y2);
    }

    // Head — small glow dot
    const headY = baseY + DRAGON_AMPLITUDE * Math.sin(-animPhase);
    p.noStroke();
    p.fill(235, 242, 255, DRAGON_MAX_ALPHA * alphaScale * 1.6);
    p.circle(dragonHeadX, headY, 5);

    // Two tiny forward-swept "horns" at the head
    const hAngle = Math.atan2(
      headY - (baseY + DRAGON_AMPLITUDE * Math.sin(Math.PI * 2 * 1 / DRAGON_WAVELENGTH - animPhase)),
      segLen
    );
    p.stroke(218, 230, 248, DRAGON_MAX_ALPHA * alphaScale * 0.7);
    p.strokeWeight(0.8);
    for (const sign of [-1, 1]) {
      const hx = dragonHeadX + Math.cos(hAngle + sign * 0.45) * 8;
      const hy = headY       + Math.sin(hAngle + sign * 0.45) * 8;
      p.line(dragonHeadX, headY, hx, hy);
    }
  }

  function drawMoonLakeGlow() {
    if (scene !== 'release' && scene !== 'end') return;
    const vis = moonVisibility();
    if (vis < 0.01) return;

    const mx    = p.width  * 0.5;
    const lakeH = p.height - horizonY;
    const cy    = horizonY + lakeH * 0.30;   // just below the horizon
    const ctx   = p.drawingContext;
    // gentle horizontal wobble
    const wobX  = p.sin(p.frameCount * 0.012) * p.width * 0.014;

    // ---- Outer diffuse elliptical halo on the water ----
    const hRx = p.width * 0.46;
    const hRy = lakeH   * 0.44;
    const haloGrd = ctx.createRadialGradient(
      mx + wobX, cy, 0, mx + wobX, cy, hRx
    );
    haloGrd.addColorStop(0,    `rgba(255,246,178,${(0.14 * vis).toFixed(3)})`);
    haloGrd.addColorStop(0.28, `rgba(248,234,152,${(0.068 * vis).toFixed(3)})`);
    haloGrd.addColorStop(0.62, `rgba(242,222,135,${(0.022 * vis).toFixed(3)})`);
    haloGrd.addColorStop(1,    `rgba(238,215,125,0)`);
    ctx.save();
    ctx.fillStyle = haloGrd;
    ctx.beginPath();
    ctx.ellipse(mx + wobX, cy, hRx, hRy, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ---- Inner soft moon disc reflection ----
    const dR = p.width * 0.068;
    const discGrd = ctx.createRadialGradient(
      mx + wobX, cy, 0, mx + wobX, cy, dR * 2.4
    );
    discGrd.addColorStop(0,    `rgba(255,250,208,${(0.40 * vis).toFixed(3)})`);
    discGrd.addColorStop(0.38, `rgba(252,241,186,${(0.18 * vis).toFixed(3)})`);
    discGrd.addColorStop(0.72, `rgba(248,233,165,${(0.055 * vis).toFixed(3)})`);
    discGrd.addColorStop(1,    `rgba(242,224,152,0)`);
    ctx.save();
    ctx.fillStyle = discGrd;
    ctx.beginPath();
    ctx.ellipse(mx + wobX, cy, dR * 2.4, dR * 1.05, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawText(msg, alphaTarget, yFrac) {
    p.noStroke();
    p.fill(201, 212, 222, alphaTarget);
    p.textAlign(p.CENTER, p.CENTER);
    p.textSize(p.min(18, p.width * 0.045));
    p.textLeading(30);
    p.text(msg, p.width * 0.1, p.height * yFrac, p.width * 0.8);
  }

  p.draw = () => {
    p.background(5, 9, 15);
    drawSky();
    drawLake();
    drawMoonLakeGlow();
    drawWaves();
    drawCityLights();
    drawMandala();
    drawMoonAndReflection();
    drawShootingStar();
    drawDragon();
    updateAngelConvergence();
    drawSparklesAndRipples();
    drawWingMotes();
    drawProgressDots();

    sceneT++;

    if (scene === 'transitioning' && sceneT > 90) {
      scene = 'shadow';
      sceneT = 0;
      duckAudioForShadow();
    }

    if (scene === 'intro' && !introTextShown && sceneT > 40) {
      introTextShown = true;
    }
    if (scene === 'intro') {
      const a = p.constrain((sceneT - 40) / 60, 0, 1) * 210;
      if (sceneT > 40) drawText('This is his inner voice.', a, 0.44);
      const b = p.constrain((sceneT - 90) / 60, 0, 1) * 190;
      if (sceneT > 90) drawText('you  can  tap  anywhere.', b, 0.88);
    }

    if (scene === 'shadow') {
      if (!shadowTextShown && sceneT > 30) shadowTextShown = true;
      if (sceneT > 30 && sceneT < 500) {
        const a = p.constrain(1 - Math.abs(sceneT - 200) / 300, 0, 1) * 190;
        drawText('Every light in the city stops.\nOnly his sound keeps moving.', a, 0.44);
      }
      // "Touch the water" — show until first tap, then fade out over 90 frames
      if (sceneT > 500) {
        if (sparkles.length === 0) {
          drawText('Touch the water. One light at a time.', 150, 0.86);
        } else {
          const fadeFrames = sceneT - tapSceneTimes[0];
          const a = p.constrain(1 - fadeFrames / 90, 0, 1) * 150;
          if (a > 1) drawText('Touch the water. One light at a time.', a, 0.86);
        }
      }
      // "one more." — only after 5th tap, very faint
      if (sparkles.length === SPARK_TARGET - 1 && tapSceneTimes.length >= SPARK_TARGET - 1) {
        const since = sceneT - tapSceneTimes[SPARK_TARGET - 2];
        const a = p.constrain((since - 20) / 60, 0, 1) * 72;
        if (a > 1) drawText('one more.', a, 0.86);
      }
      if (sparkles.length >= SPARK_TARGET && scene === 'shadow') {
        scene = 'angel';
        sceneT = 0;
        enterAngelScene();
        liftAudioForAngel();
        playAngelChimes();
      }
    }

    if (scene === 'angel') {
      if (sceneT > 40 && sceneT < 260) {
        const a = p.constrain(1 - Math.abs(sceneT - 150) / 190, 0, 1) * 200;
        drawText('The lights gather into something larger.', a, 0.44);
      }
      if (sceneT >= 260 && sceneT < ANGEL_DURATION) {
        const mid = 260 + (ANGEL_DURATION - 260) / 2;
        const a = p.constrain(1 - Math.abs(sceneT - mid) / ((ANGEL_DURATION - 260) / 2), 0, 1) * 200;
        drawText('It asks nothing of you. It only stays.', a, 0.44);
      }
      if (sceneT >= ANGEL_DURATION) {
        scene = 'release';
        sceneT = 0;
        wingMotes = [];
        liftAudioForRelease();
      }
    }

    if (scene === 'release') {
      // Mandala: blooms once at the start of release (angels just fully gathered)
      if (!mandalaShown && sceneT === 5) {
        mandalaShown = true;
        mandala = { t: 0 };
      }
      // Dragon: spawns once
      if (!dragonShown && sceneT === 50) {
        dragonShown = true;
        dragonHeadX = -(p.width * DRAGON_BODY_FRAC);
      }
      if (sceneT > 60 && sceneT < 340) {
        const a = p.constrain(1 - Math.abs(sceneT - 190) / 210, 0, 1) * 200;
        drawText('The light is full. The water mirrors the moon.', a, 0.44);
      }
      if (sceneT === 260) showChoices();
    }

    if (scene === 'end') {
      // canvas stays, just quiet 窶・DOM overlay carries the closing line
    }
  };

  window.__handleTap = (x, y) => {
    if (scene !== 'shadow') return;
    if (x === undefined || y === undefined) return;
    if (sparkles.length >= SPARK_TARGET) return;
    sparkles.push({ x, y, phase: p.random(p.TWO_PI) });
    tapSceneTimes.push(sceneT);
    // Shooting star: triggers once on the 6th tap, streaks toward the moon
    if (sparkles.length === SPARK_TARGET && !starShown) {
      starShown = true;
      const mx0 = p.width * 0.5, my0 = horizonY * 0.32;
      const sx  = mx0 + p.width * 0.30, sy = my0 + horizonY * 0.44;
      const dx  = mx0 - sx, dy = my0 - sy;
      const d   = Math.sqrt(dx * dx + dy * dy);
      shootingStar = { x0: sx, y0: sy, dirX: dx / d, dirY: dy / d, dist: d, t: 0 };
    }
    ripples.push({ x, y, age: 0 });
    const notes = [392, 440, 493.88, 523.25, 587.33, 659.25];
    chime(notes[sparkles.length - 1] || 660);
  };
};

new p5(sketch);

// First tap starts the audio and transitions to the experience.
// Subsequent taps place sparkles on the water (shadow scene).
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#choiceLayer, #closing, #skip, #endButtons')) return;
  if (!started) {
    started = true;
    try {
      setupAudio();
    } catch (err) {
      console.warn('AudioContext init failed, continuing without audio:', err);
    }
    scene = 'transitioning';
    sceneT = 0;
  }
  window.__handleTap && window.__handleTap(e.clientX, e.clientY);
});

function showChoices() {
  const layer = document.getElementById('choiceLayer');
  layer.classList.add('show');
  requestAnimationFrame(() => {
    document.getElementById('btnRelease').classList.add('visible');
    document.getElementById('btnKeep').classList.add('visible');
  });
}

function finishWith(message) {
  const layer = document.getElementById('choiceLayer');
  layer.classList.remove('show');
  scene = 'end';
  sceneT = 0;
  fadeAudioOut();
  const closing = document.getElementById('closing');
  closing.textContent = message;
  setTimeout(() => closing.classList.add('show'), 200);
  // Show back/stop buttons after closing text has faded in
  setTimeout(() => document.getElementById('endButtons').classList.add('show'), 2200);
}

document.getElementById('btnRelease').addEventListener('click', () => {
  finishWith('What do you wish to do?');
  setTimeout(() => showHanielAngel('What you released\nno longer holds you.'), 4400);
});
document.getElementById('btnKeep').addEventListener('click', () => {
  finishWith('What you kept\nquietly keeps glowing within you.');
});

document.getElementById('btnBack').addEventListener('click', () => {
  location.reload();
});

document.getElementById('btnStop').addEventListener('click', () => {
  // Stop audio immediately
  if (audioCtx) {
    try { audioCtx.close(); } catch(e) {}
    audioCtx = null;
  }
  // Fade out all overlays, leave canvas quiet
  const els = ['#closing', '#hanielReveal', '#endButtons'];
  els.forEach(sel => {
    const el = document.querySelector(sel);
    if (el) { el.style.transition = 'opacity 2s ease'; el.style.opacity = '0'; }
  });
  setTimeout(() => {
    document.getElementById('endButtons').classList.remove('show');
    document.getElementById('closing').classList.remove('show');
    document.getElementById('hanielReveal').classList.remove('show');
  }, 2100);
});

document.getElementById('skip').addEventListener('click', () => {
  location.reload();
});

/* ---------- Haniel angel reveal ---------- */
function showHanielAngel(message) {
  document.getElementById('hanielText').textContent = message;

  // Fade out the previous closing overlay so only the angel scene remains
  const closing = document.getElementById('closing');
  closing.style.transition = 'opacity 2.5s ease';
  closing.style.opacity = '0';

  // Spawn animated petals & leaves
  const reveal = document.getElementById('hanielReveal');
  const petalColors = [
    'rgba(255,255,255,0.82)', 'rgba(255,255,255,0.72)',
    'rgba(248,208,218,0.78)', 'rgba(240,192,202,0.7)',
    'rgba(252,240,228,0.74)', 'rgba(240,228,210,0.68)'
  ];
  const leafColors = [
    'rgba(90,148,58,0.72)', 'rgba(78,136,48,0.65)',
    'rgba(108,168,72,0.62)', 'rgba(68,124,42,0.6)'
  ];

  for (let i = 0; i < 18; i++) {
    const isPetal = i < 12;
    const el = document.createElement('div');
    el.className = isPetal ? 'h-petal' : 'h-leaf';
    const startX = Math.random() * 85 + 5;  // 5窶・0vw
    const startY = Math.random() * 80 + 10; // 10窶・0vh
    const size  = isPetal ? (Math.random() * 10 + 8) : (Math.random() * 12 + 9);
    const op    = (Math.random() * 0.3 + 0.45).toFixed(2);
    const dx    = (Math.random() * 200 + 80).toFixed(0);
    const dy    = -(Math.random() * 260 + 120).toFixed(0);
    const spin  = ((Math.random() > 0.5 ? 1 : -1) * (Math.random() * 480 + 200)).toFixed(0) + 'deg';
    const dur   = (Math.random() * 6 + 7).toFixed(1);
    const delay = (Math.random() * 5).toFixed(1);
    const color = isPetal
      ? petalColors[Math.floor(Math.random() * petalColors.length)]
      : leafColors[Math.floor(Math.random() * leafColors.length)];

    el.style.cssText = [
      `left:${startX}vw`, `top:${startY}vh`,
      `width:${size}px`, `height:${(size * (isPetal ? 0.58 : 1)).toFixed(1)}px`,
      `background:${color}`,
      `--op:${op}`, `--dx:${dx}px`, `--dy:${dy}px`, `--spin:${spin}`,
      `animation-duration:${dur}s`,
      `animation-delay:${delay}s`,
      `animation-iteration-count:infinite`
    ].join(';');

    reveal.appendChild(el);
  }

  reveal.classList.add('show');
}
